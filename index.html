<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPARK</title>

    <!-- iOS "Add to Home Screen" — the tab favicon above is SVG, but iOS
         only reliably picks up a PNG apple-touch-icon (no alpha/transparency
         needed here, the source art is already full-bleed). Without
         apple-mobile-web-app-title, iOS falls back to the page <title> or
         the URL for the name shown under the home screen icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Spark" />
    <!-- apple-mobile-web-app-capable is iOS Safari's own name for this and still
         needed there; mobile-web-app-capable is the standard name Chrome/Android
         expect instead (apple-mobile-web-app-capable alone logs a deprecation
         warning in their console) — both stay, each for its own browser. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
